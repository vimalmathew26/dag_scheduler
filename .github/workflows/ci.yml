name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The suite spawns real subprocesses and asserts they are killed, so
      # it needs a real process tree. It also enforces timeouts in wall
      # clock time, hence the generous job timeout.
      - name: Run tests
        timeout-minutes: 10
        run: pytest -q --cov=dag_scheduler --cov-report=term-missing --cov-fail-under=80

  smoke:
    name: End to end smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Follows the README's own quickstart. If this breaks, the
      # documentation is wrong, which is the failure mode that matters most.
      - name: Start the daemon and run the example pipeline
        timeout-minutes: 3
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          set -euo pipefail
          dag-scheduler daemon > daemon.log 2>&1 &
          DAEMON_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done

          dag-scheduler status
          dag-scheduler trigger extract_data
          sleep 10
          dag-scheduler status
          dag-scheduler stats

          DB="$XDG_DATA_HOME/dag_scheduler/scheduler.db"
          echo "Asserting exactly one run per job in the chain"
          python - "$DB" <<'PY'
          import sqlite3, sys
          rows = dict(
              sqlite3.connect(sys.argv[1])
              .execute("SELECT job_name, COUNT(*) FROM job_runs GROUP BY job_name")
          )
          expected = {
              "extract_data", "transform_data", "load_data",
              "cleanup_logs", "archive_old",
          }
          assert set(rows) == expected, f"unexpected jobs ran: {rows}"
          duplicated = {k: v for k, v in rows.items() if v != 1}
          assert not duplicated, f"jobs ran more than once: {duplicated}"
          print("one run per job, as documented")
          PY

          kill -TERM $DAEMON_PID
          sleep 5
          echo "Asserting a clean shutdown left nothing behind"
          ! pgrep -x sleep > /dev/null || (echo "orphaned processes" && exit 1)
          ! grep -q "Task exception was never retrieved" daemon.log \
            || (echo "unretrieved task exception" && exit 1)
          echo "shutdown clean"

      - name: Daemon log
        if: always()
        run: cat daemon.log
