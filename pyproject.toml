[project]
name = "dag-scheduler"
version = "0.2.0"
description = "A single-node DAG job scheduler daemon with subprocess execution and hot-reloadable job definitions."
authors = [{name = "Vimal Mathew", email = "vimalmathew26@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["scheduler", "dag", "asyncio", "workflow", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

# Lower bounds are the versions this is known to work against; upper bounds
# stop a major release changing behaviour silently. Previously none of these
# were constrained at all.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "click>=8.1,<9.0",
    "aiosqlite>=0.19,<1.0",
    "pyyaml>=6.0,<7.0",
    "watchdog>=4.0,<7.0",
    "pydantic>=2.6,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/vimalmathew26/dag_scheduler"
Source = "https://github.com/vimalmathew26/dag_scheduler"

[project.scripts]
dag-scheduler = "dag_scheduler.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/dag_scheduler"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Deliberately not --strict. At that level the remaining errors are almost
# all Any propagation out of aiosqlite and pydantic, and satisfying them
# would mean scattering type: ignore comments, which reads worse than not
# claiming the strictness at all.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",     # line length is reported by the formatter, not the linter
    "B008",     # FastAPI's Depends() in defaults is the framework's idiom
    "SIM108",   # ternaries are not always clearer than an if
    "UP041",    # see below
]
# UP041 rewrites `except asyncio.TimeoutError` to the builtin TimeoutError.
# That is correct on 3.11+, where the two are aliases, and silently wrong on
# 3.10, where they are distinct classes and the handler stops firing. The
# project requires 3.11, but keeping the explicit asyncio spelling costs
# nothing there and keeps the timeout paths verifiable on an older
# interpreter. Applying this fix broke four timeout tests before it was
# caught, which is the argument for leaving it off.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
