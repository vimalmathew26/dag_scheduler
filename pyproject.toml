[project]
name = "dag-scheduler"
version = "0.2.0"
description = "A single-node DAG job scheduler daemon with subprocess execution and hot-reloadable job definitions."
authors = [{name = "Vimal Mathew", email = "vimalmathew26@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["scheduler", "dag", "asyncio", "workflow", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

# Lower bounds are the versions this is known to work against; upper bounds
# stop a major release changing behaviour silently. Previously none of these
# were constrained at all.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "click>=8.1,<9.0",
    "aiosqlite>=0.19,<1.0",
    "pyyaml>=6.0,<7.0",
    "watchdog>=4.0,<7.0",
    "pydantic>=2.6,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/vimalmathew26/dag_scheduler"
Source = "https://github.com/vimalmathew26/dag_scheduler"

[project.scripts]
dag-scheduler = "dag_scheduler.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
